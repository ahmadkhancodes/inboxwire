name: Docker image
# Builds the self-host image and pushes it to GHCR when a version tag is pushed (v1.2.3). Not run on pull requests.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmadkhancodes/inboxwire
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public half of the licence key (a repository variable, not a secret). The private key is never in CI.
          build-args: |
            LICENCE_PUBLIC_KEY=${{ vars.LICENCE_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  casa-kit:
    # The CASA Readiness Kit of the same version, attached to the release next to the image.
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/build-casa-kit.ts "${GITHUB_REF_NAME#v}" casa-kit.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: casa-kit.zip
